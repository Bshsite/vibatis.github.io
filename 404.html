<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Redirection Vibatis...</title>
  <meta name="robots" content="noindex">

  <script>
    const redirects = {
      // anciennes pages principales -> accueil
      "/nous.php": "index.html",
      "/projets.php": "index.html",
      "/index.php": "index.html",

      // contact
      "/contact.php": "/contact.html",

      // projets -> fichiers actuels
      "/maison-de-valmont": "/projet-valmont.html",
      "/maison-du-sieur-dargenteuil": "/projet-sieur-d-argenteuil.html",
      "/maison-des-granites": "/projet-granites.html",
      "/maison-de-la-rochelle": "/projet-rochelle.html",
    };

    let path = window.location.pathname.replace(/\/+$/, "");
    if (path === "") path = "/";

    const target = redirects[path];

    if (target) {
      window.location.replace(target);
    }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding-top: 80px;
      margin: 0;
    }

    a {
      color: #9cf;
    }
  </style>
</head>
<body>
  <h1>Page non trouvée</h1>
  <p>Redirection automatique si une correspondance existe...</p>
  <p><a href="/">Retour à l'accueil</a></p>
</body>
</html>
