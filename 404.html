<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Redirection Vibatis...</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    const redirects = {
      // anciennes pages PHP
      "/nous.php": "/",
      "/projets.php": "/",
      "/index.php": "/",
      "/contact.php": "/contact.html",

      "/projet-valmont.php": "/projet-valmont.html",
      "/projet-sieur-d-argenteuil.php": "/projet-sieur-d-argenteuil.html",
      "/projet-granites.php": "/projet-granites.html",
      "/projet-rochelle.php": "/projet-rochelle.html",

      // URLs propres / nouvelles tentées par Google ou par toi
      "/nous": "/",
      "/projets": "/",
      "/contact": "/contact.html",

      "/maison-de-valmont": "/projet-valmont.html",
      "/maison-du-sieur-dargenteuil": "/projet-sieur-d-argenteuil.html",
      "/maison-des-granites": "/projet-granites.html",
      "/maison-de-la-rochelle": "/projet-rochelle.html"
    };

    let path = window.location.pathname.replace(/\/+$/, "");
    if (path === "") path = "/";

    const target = redirects[path];

    if (target) {
      window.location.replace(target);
    }
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 80px 20px;
    }

    a {
      color: #9cf;
    }
  </style>
</head>
<body>
  <h1>Page non trouvée</h1>
  <p>Redirection automatique si une correspondance existe...</p>
  <p><a href="/">Retour à l'accueil</a></p>
</body>
</html>
